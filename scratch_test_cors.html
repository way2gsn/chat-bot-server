<!DOCTYPE html>
<html>
<head>
  <title>CORS Debugger</title>
</head>
<body>
  <h1>CORS / Connection Test</h1>
  <button id="testBtn">Test Connection</button>
  <pre id="output">Click button to test...</pre>

  <script>
    document.getElementById('testBtn').addEventListener('click', async () => {
      const output = document.getElementById('output');
      output.textContent = 'Testing...';
      try {
        const url = 'https://phasalbazar.up.railway.app/admin/stats';
        const res = await fetch(url, {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer phasal123'
          }
        });
        if (res.ok) {
          const json = await res.json();
          output.textContent = 'Success:\n' + JSON.stringify(json, null, 2);
        } else {
          output.textContent = `Server responded with status ${res.status}: ${res.statusText}`;
        }
      } catch (err) {
        output.textContent = 'Fetch failed! Error details:\n' + err.stack;
      }
    });
  </script>
</body>
</html>
